apiVersion: couchbase.com/v2
kind: CouchbaseBucket
metadata:
  name: bucket1
spec:
  memoryQuota: 100Mi
  storageBackend: magma
  historyRetention:
    seconds: 3600
---
apiVersion: couchbase.com/v2
kind: CouchbaseBucket
metadata:
  name: bucket2
spec:
  memoryQuota: 100Mi
  storageBackend: magma
---
apiVersion: couchbase.com/v2
kind: CouchbaseBucket
metadata:
  name: bucket3
spec:
  memoryQuota: 100Mi
  storageBackend: couchstore
---
apiVersion: couchbase.com/v2
kind: CouchbaseBucket
metadata:
  name: bucket4
spec:
  memoryQuota: 100Mi
  storageBackend: magma
  historyRetention:
    bytes: 2147483648
---
apiVersion: couchbase.com/v2
kind: CouchbaseCluster
metadata:
  name: cluster1
spec:
  image: couchbase/server:8.1.0
  security:
    adminSecret: cb-example-auth
    rbac:
      managed: true
  buckets:
    managed: true
  backup:
    managed: false
    image: couchbase/operator-backup:1.7.0
  servers:
    - size: 1
      name: all_services
      services:
        - data
        - index
        - query
  cluster:
    dataServiceMemoryQuota: 4048Mi
status:
  currentVersion: 8.1.0
  size: 1
---
apiVersion: v1
kind: Secret
